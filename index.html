
<!doctype html>
<html lang="es">
  <head>
    <!-- Define la codificación de caracteres del documento. -->
    <meta charset="UTF-8" />

    <!-- Configura la visualización de la aplicación en diferentes dispositivos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Define el color del tema del navegador. -->
    <meta name="theme-color" content="#241b24" />

    <!-- Establece el título que aparece en la pestaña del navegador. -->
    <title>Lunara | Moda femenina</title>
  </head>

  <body>
    <!-- Elemento HTML donde React monta y renderiza toda la aplicación. -->
    <div id="root"></div>

    <!-- Carga el punto de entrada de React, encargado de iniciar la aplicación. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
